<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050510"/>
      <stop offset="0.5" stop-color="#0a0620"/>
      <stop offset="1" stop-color="#050510"/>
    </linearGradient>
    <linearGradient id="neon" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#22e4ff"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ff2ec4"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1200 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <filter id="glowText" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="typeclip">
      <rect x="418" y="278" width="0" height="34">
        <animate attributeName="width" from="0" to="374" dur="2.4s" begin="1.2s" fill="freeze"/>
      </rect>
    </clipPath>
    <style>
      .star { animation: twinkle 3s ease-in-out infinite; }
      @keyframes twinkle { 0%, 100% { opacity: .12; } 50% { opacity: .9; } }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .fadeup { opacity: 0; animation: fadeup 1.2s ease-out forwards; }
      @keyframes fadeup { to { opacity: 1; } }
    </style>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>

  <g filter="url(#soft)">
    <circle cx="200" cy="120" r="130" fill="#7c3aed" opacity="0.35">
      <animateTransform attributeName="transform" type="translate" values="0 0; 70 40; 0 0" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="280" r="150" fill="#0ea5e9" opacity="0.28">
      <animateTransform attributeName="transform" type="translate" values="0 0; -60 -50; 0 0" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="60" r="110" fill="#ff2ec4" opacity="0.20">
      <animateTransform attributeName="transform" type="translate" values="0 0; 40 60; 0 0" dur="16s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g fill="#e0f2fe">
    <circle class="star" cx="60"   cy="60"  r="1.6"/>
    <circle class="star" cx="150"  cy="300" r="1.2" style="animation-delay:-1s"/>
    <circle class="star" cx="240"  cy="90"  r="1.8" style="animation-delay:-2s"/>
    <circle class="star" cx="330"  cy="340" r="1.3" style="animation-delay:-.5s"/>
    <circle class="star" cx="420"  cy="50"  r="1.5" style="animation-delay:-1.5s"/>
    <circle class="star" cx="90"   cy="200" r="1.2" style="animation-delay:-2.5s"/>
    <circle class="star" cx="520"  cy="330" r="1.6" style="animation-delay:-2s"/>
    <circle class="star" cx="600"  cy="40"  r="1.4" style="animation-delay:-1.2s"/>
    <circle class="star" cx="700"  cy="350" r="1.7" style="animation-delay:-.4s"/>
    <circle class="star" cx="780"  cy="70"  r="1.3" style="animation-delay:-1.8s"/>
    <circle class="star" cx="860"  cy="320" r="1.5" style="animation-delay:-2.6s"/>
    <circle class="star" cx="940"  cy="50"  r="1.8" style="animation-delay:-.9s"/>
    <circle class="star" cx="1020" cy="300" r="1.2" style="animation-delay:-1.4s"/>
    <circle class="star" cx="1100" cy="90"  r="1.6" style="animation-delay:-2.2s"/>
    <circle class="star" cx="1160" cy="250" r="1.3" style="animation-delay:-.7s"/>
    <circle class="star" cx="500"  cy="140" r="1.1" style="animation-delay:-1.9s"/>
    <circle class="star" cx="1060" cy="180" r="1.2" style="animation-delay:-.2s"/>
    <circle class="star" cx="180"  cy="150" r="1.0" style="animation-delay:-2.8s"/>
  </g>

  <text x="600" y="168" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800" fill="url(#neon)" opacity="0.55" filter="url(#glowText)" textLength="1000" lengthAdjust="spacingAndGlyphs">HALDUN MAMMADZADA</text>
  <text x="600" y="168" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800" fill="url(#neon)" textLength="1000" lengthAdjust="spacingAndGlyphs">HALDUN MAMMADZADA</text>

  <text class="fadeup" style="animation-delay:.4s" x="600" y="222" text-anchor="middle" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="22" letter-spacing="6" fill="#7dd3fc">&lt; SENIOR FRONTEND ENGINEER /&gt;</text>

  <g clip-path="url(#typeclip)">
    <text x="420" y="302" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="22" fill="#94a3b8" textLength="370" lengthAdjust="spacingAndGlyphs">~ i make the web feel alive</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3.6s" dur="0.2s" fill="freeze"/>
    <rect class="blink" x="796" y="282" width="11" height="24" fill="#22e4ff"/>
  </g>

  <rect x="0" y="394" width="1200" height="6" fill="url(#neon)" opacity="0.9"/>
</svg>
