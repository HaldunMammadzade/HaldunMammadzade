<svg width="1200" height="10" viewBox="0 0 1200 10" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="260" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22e4ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ff2ec4" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur2" x="-50%" y="-400%" width="200%" height="900%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <rect x="0" y="4" width="1200" height="2" fill="#302b63" opacity="0.55"/>
  <g>
    <rect x="0" y="1" width="260" height="8" rx="4" fill="url(#neon)" filter="url(#blur2)"/>
    <rect x="0" y="3" width="260" height="4" rx="2" fill="url(#neon)"/>
    <animateTransform attributeName="transform" type="translate" from="-260 0" to="1200 0" dur="3.2s" repeatCount="indefinite"/>
  </g>
</svg>
