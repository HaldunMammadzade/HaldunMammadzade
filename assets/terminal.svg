<svg width="900" height="440" viewBox="0 0 900 440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="cmd1clip">
      <rect x="70" y="70" width="0" height="30">
        <animate attributeName="width" from="0" to="82" dur="0.7s" begin="0.6s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="cmd2clip">
      <rect x="70" y="146" width="0" height="30">
        <animate attributeName="width" from="0" to="154" dur="0.9s" begin="2.3s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="cmd3clip">
      <rect x="70" y="222" width="0" height="30">
        <animate attributeName="width" from="0" to="154" dur="0.9s" begin="4.2s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="cmd4clip">
      <rect x="70" y="328" width="0" height="30">
        <animate attributeName="width" from="0" to="82" dur="0.6s" begin="6.4s" fill="freeze"/>
      </rect>
    </clipPath>
    <style>
      .t { font-family: Menlo, Consolas, 'Courier New', monospace; font-size: 20px; }
      .small { font-family: Menlo, Consolas, 'Courier New', monospace; font-size: 14px; }
      .win { filter: drop-shadow(0 14px 44px rgba(124, 58, 237, .35)); }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .pulse { animation: pulse 1.6s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    </style>
  </defs>

  <g class="win">
    <rect x="10" y="10" width="880" height="418" rx="14" fill="#0d1117" stroke="#30363d"/>
    <line x1="10" y1="52" x2="890" y2="52" stroke="#30363d"/>
    <circle cx="42" cy="31" r="7" fill="#ff5f56"/>
    <circle cx="66" cy="31" r="7" fill="#ffbd2e"/>
    <circle cx="90" cy="31" r="7" fill="#27c93f"/>
    <text class="small" x="450" y="36" text-anchor="middle" fill="#8b949e">haldun@frontend: ~/craft</text>
  </g>

  <text class="t" x="40" y="92" fill="#34d399">&#10095;</text>
  <g clip-path="url(#cmd1clip)">
    <text class="t" x="72" y="92" fill="#e6edf3">whoami</text>
  </g>
  <text class="t" x="72" y="124" fill="#94a3b8" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.5s" fill="freeze"/>
    haldun &#183; <tspan fill="#22e4ff">senior frontend engineer</tspan>
  </text>

  <text class="t" x="40" y="168" fill="#34d399">&#10095;</text>
  <g clip-path="url(#cmd2clip)">
    <text class="t" x="72" y="168" fill="#e6edf3">stack --core</text>
  </g>
  <text class="t" x="72" y="200" fill="#94a3b8" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.4s" fill="freeze"/>
    <tspan fill="#22e4ff">react</tspan> &#9650; <tspan fill="#e6edf3">next.js</tspan> &#9650; <tspan fill="#8b5cf6">typescript</tspan> &#9650; <tspan fill="#34d399">vue</tspan> &#9650; <tspan fill="#ff2ec4">angular</tspan>
  </text>

  <text class="t" x="40" y="244" fill="#34d399">&#10095;</text>
  <g clip-path="url(#cmd3clip)">
    <text class="t" x="72" y="244" fill="#e6edf3">craft --list</text>
  </g>
  <text class="t" x="72" y="276" fill="#94a3b8" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="5.3s" fill="freeze"/>
    <tspan fill="#8b5cf6">&#10022;</tspan> motion &amp; 3d interfaces&#160;&#160;&#160;&#160;<tspan fill="#8b5cf6">&#10022;</tspan> design systems
  </text>
  <text class="t" x="72" y="306" fill="#94a3b8" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="5.7s" fill="freeze"/>
    <tspan fill="#8b5cf6">&#10022;</tspan> performance obsession&#160;&#160;&#160;&#160;<tspan fill="#8b5cf6">&#10022;</tspan> ai-powered UIs
  </text>

  <text class="t" x="40" y="350" fill="#34d399">&#10095;</text>
  <g clip-path="url(#cmd4clip)">
    <text class="t" x="72" y="350" fill="#e6edf3">status</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="7.2s" fill="freeze"/>
    <text class="t" x="72" y="382" fill="#94a3b8"><tspan class="pulse" fill="#34d399">&#9679;</tspan> turning coffee into components &#8230; <tspan fill="#22e4ff">ready in 0.42s</tspan></text>
    <rect class="blink" x="530" y="364" width="11" height="22" fill="#22e4ff"/>
  </g>
</svg>
